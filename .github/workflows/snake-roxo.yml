# Gera a cobrinha do gráfico de contribuições nas cores da marca (roxo + verde neon)
# e salva no branch "output" deste repositório. Roda todo dia e pode ser disparado manualmente.
name: Cobrinha roxo e verde

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-roxo.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#ebedf0,#d9c8ff,#b48cff,#8b5cf6,#5b21b6
            dist/snake-roxo-dark.svg?palette=github-dark&color_snake=#A3FF3C&color_dots=#161320,#2e1f5e,#5b21b6,#8b5cf6,#c4a1ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
